services:
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy

  backend:
    build:
      context: ..
      dockerfile: infra/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      CITIZEN_KAREN_DB_PATH: /app/data/citizen-karen.db
      CORS_ORIGINS: http://localhost:8080
      FCC_CONNECTOR_MODE: network
      FCC_API_URL: http://mock-fcc:8001/fcc/robocall
    volumes:
      - complaint-data:/app/data
    depends_on:
      mock-fcc:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mock-fcc:
    build:
      context: ..
      dockerfile: infra/Dockerfile.mock-fcc
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  complaint-data:
