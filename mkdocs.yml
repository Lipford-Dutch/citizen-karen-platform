site_name: Citizen Karen
site_description: Product and engineering documentation for the Citizen Karen civic complaint navigator.
site_url: https://lipford-dutch.github.io/citizen-karen-platform/
repo_url: https://github.com/Lipford-Dutch/citizen-karen-platform
edit_uri: edit/main/docs/

theme:
  name: mkdocs
  color_mode: auto
  user_color_mode_toggle: true

nav:
  - Overview: index.md
  - Developer setup: DEVELOPER_SETUP.md
  - Release handoff: HANDOFF.md
  - Product:
      - Vision: VISION.md
      - Requirements: BRD_TRD.md
      - Roadmap: roadmap.md
      - Project flow: projectflow.md
  - Trust and safety:
      - Consent and terms: CONSENT_AND_TERMS.md
      - Data governance: DATA_GOVERNANCE.md
      - Legal boundaries: LEGAL_BOUNDARIES.md
      - Accessibility: ACCESSIBILITY.md
      - Accessibility audit: ACCESSIBILITY_AUDIT_CHECKLIST.md
      - Security: SECURITY.md
  - Engineering:
      - System architecture: SYSTEM_ARCHITECTURE.md
      - Agency plugin guide: AGENCY_PLUGIN_GUIDE.md
      - Observability: OBSERVABILITY.md

markdown_extensions:
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true

exclude_docs: |
  *.py

copyright: Copyright © 2026 Citizen Karen contributors.
