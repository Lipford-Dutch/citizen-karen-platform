name: Frontend CI

on:
push:
paths:
- "frontend/"
- ".github/workflows/frontend-ci.yml"
pull_request:
paths:
- "frontend/"
- ".github/workflows/frontend-ci.yml"

jobs:
frontend-ci:
runs-on: ubuntu-latest
defaults:
run:
working-directory: frontend
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Set up Node
    uses: actions/setup-node@v4
    with:
      node-version: "20"

  - name: Install & Test (if package.json exists)
    run: |
      if [ -f package.json ]; then
        npm install
        if npm run | grep -q "test"; then
          npm test -- --watch=false || true
        fi
        if npm run | grep -q "build"; then
          npm run build || true
        fi
      else
        echo "No package.json yet; skipping frontend CI."
      fi
