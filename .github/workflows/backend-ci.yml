name: Backend CI

on:
push:
paths:
- "backend/"
- ".github/workflows/backend-ci.yml"
pull_request:
paths:
- "backend/"
- ".github/workflows/backend-ci.yml"

jobs:
backend-ci:
runs-on: ubuntu-latest
defaults:
run:
working-directory: backend
steps:
- name: Checkout
uses: actions/checkout@v4

  - name: Set up Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.11"

  - name: Install dependencies
    run: |
      python -m venv venv
      source venv/bin/activate
      pip install -r requirements.txt

  - name: Run basic FastAPI import check
    run: |
      source venv/bin/activate
      python -c "import fastapi, httpx; print('Backend imports OK')"
