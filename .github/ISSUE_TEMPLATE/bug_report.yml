name: Bug report
description: Report a reproducible problem without including complaint content or personal data.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Do not include names, contact details, complaint narratives, tracking IDs, or other personal data."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the behavior using test or redacted data.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser or environment
      placeholder: Firefox on Windows 11
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed all personal data and complaint content.
          required: true
