openapi: 3.1.0
info:
  title: Citizen Karen API
  version: 1.0.0
  description: Consent-first intake and status tracking for the Day-1 FCC complaint flow.
  contact:
    name: Citizen Karen Platform
    url: https://github.com/Lipford-Dutch/citizen-karen-platform
  license:
    name: MIT
servers:
  - url: http://localhost:8000
    description: Local development server
paths:
  /health:
    get:
      operationId: healthCheck
      summary: Check service health
      tags: [System]
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                type: object
                required: [status, version]
                properties:
                  status: {type: string, const: ok}
                  version: {type: string, example: 1.0.0}
  /api/complaints:
    post:
      operationId: submitComplaint
      summary: Submit a consented FCC complaint
      description: Stores a local receipt, records consent, and sends the complaint through the configured FCC connector.
      tags: [Complaints]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ComplaintSubmission"}
      responses:
        "201":
          description: Complaint accepted and submitted through the configured connector.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ComplaintCreated"}
        "400":
          description: Unsupported agency.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
        "422":
          description: Consent, privacy, or field validation failed.
  /api/complaints/{tracking_id}:
    parameters:
      - in: path
        name: tracking_id
        required: true
        description: Citizen Karen tracking ID returned after submission.
        schema: {type: string, pattern: "^CK-[0-9]{4}-[A-F0-9]{6}$", example: CK-2026-8F3A9C}
    get:
      operationId: getComplaintStatus
      summary: Retrieve a complaint status receipt
      tags: [Complaints]
      responses:
        "200":
          description: Current local receipt and agency reference.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ComplaintStatus"}
        "404":
          description: Tracking ID not found.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Error"}
    delete:
      operationId: deleteComplaintCopy
      summary: Delete Citizen Karen's stored complaint content
      description: Redacts the locally stored complaint payload. It does not delete the receiving agency's separate copy.
      tags: [Privacy]
      responses:
        "200":
          description: Local complaint content deleted.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DeletionResponse"}
        "404":
          description: Tracking ID not found.
components:
  schemas:
    ComplaintSubmission:
      type: object
      additionalProperties: false
      required: [agency, full_name, email, complaint_type, description, consent]
      properties:
        agency: {type: string, const: fcc}
        full_name: {type: string, minLength: 2, maxLength: 120, example: Alex Citizen}
        email: {type: string, format: email, example: alex@example.com}
        phone_number: {type: [string, "null"], maxLength: 32, example: "+15555551234"}
        complaint_type: {type: string, minLength: 3, maxLength: 120, example: Unwanted calls or texts}
        description:
          type: string
          minLength: 20
          maxLength: 4000
          description: Do not include Social Security or payment card numbers.
        consent: {type: boolean, const: true}
        consent_version: {type: string, const: "2026-08-23"}
        website:
          type: string
          maxLength: 0
          description: Anti-bot honeypot; leave empty.
    ComplaintCreated:
      allOf:
        - {$ref: "#/components/schemas/ComplaintStatusBase"}
        - type: object
          required: [received]
          properties:
            received: {type: boolean, const: true}
    ComplaintStatus:
      allOf:
        - {$ref: "#/components/schemas/ComplaintStatusBase"}
        - type: object
          required: [complaint_type, last_updated, consent_version]
          properties:
            complaint_type: {type: string}
            last_updated: {type: string, format: date-time}
            consent_version: {type: string}
    ComplaintStatusBase:
      type: object
      required: [id, tracking_id, state, agency, submitted_at]
      properties:
        id: {type: string, format: uuid}
        tracking_id: {type: string, example: CK-2026-8F3A9C}
        state: {$ref: "#/components/schemas/ComplaintState"}
        agency: {type: string, const: fcc}
        agency_reference: {type: [string, "null"], example: FCC-A1B2C3}
        submitted_at: {type: string, format: date-time}
    ComplaintState:
      type: string
      enum: [received, submitted, acknowledged, under_review, resolved, rejected, deleted]
    DeletionResponse:
      type: object
      required: [tracking_id, state, message]
      properties:
        tracking_id: {type: string}
        state: {type: string, const: deleted}
        message: {type: string}
    Error:
      type: object
      required: [detail]
      properties:
        detail: {type: string}
